name: PlanPulse
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  PlanPulse:
    type: application
    platform: iOS
    sources: [PlanPulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pvshoppersllc.planpulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PlanPulse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
